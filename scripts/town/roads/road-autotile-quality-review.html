<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Maple Falls — road quality review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d171c;color:#fff;font:15px system-ui}header{padding:14px 20px;border-bottom:1px solid #47605d;display:flex;gap:12px;flex-wrap:wrap;align-items:center}h1{font-size:20px;margin:0}p{margin:4px 0;color:#d4e1db}button,input{font:inherit}button{padding:9px 12px;border:1px solid #be8648;background:#19312a;color:#fff;cursor:pointer}button.active{background:#d96c13}label{display:inline-flex;gap:6px;align-items:center}#view{height:calc(100vh - 170px);min-height:350px;overflow:auto;background:#334535;touch-action:none}canvas{display:block}footer,.links{padding:10px 20px;color:#e0e8e3;font-size:13px}a{color:#ffd086;margin-right:18px}</style>
<style>body{height:100dvh;display:flex;flex-direction:column}header,.links,footer{flex-shrink:0}#view{height:auto;flex:1;min-height:180px}@media(max-width:600px){header{padding:10px;gap:8px}h1{font-size:17px}p{font-size:13px}button{padding:8px}label{font-size:13px}.links,footer{padding:8px 10px}.links a{display:inline-block;margin-bottom:5px}}</style>
<header><div><h1>Maple Falls · road quality correction</h1><p>Build/erase by dragging. Zoom to 100% to check native detail.</p></div><button id="draw" class="active">Build road</button><button id="erase">Erase</button><button id="reset">Reset proof</button><button id="clear">Clear</button><button id="save">Save JSON</button><label><input id="lines" type="checkbox" checked>Blended paint</label><label><input id="lights" type="checkbox" checked>Light pools</label><label><input id="leaves" type="checkbox" checked>Individual leaves</label><label>Zoom <input id="zoom" type="range" min="12" max="150" value="25"><span id="zoom-value">25%</span></label></header>
<div class="links"><a href="../road-builder-proof.png">Full-resolution proof</a><a href="before-after-native.png">Before / after at native size</a><a href="../road-network-transparent.png">Transparent road network</a></div>
<div id="view"><div id="stage" style="position:relative"><canvas id="canvas" style="position:absolute"></canvas></div></div><footer id="status">Loading painted PNGs…</footer>
<script>const data=/*ASSETS*/;
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),view=document.getElementById('view'),stage=document.getElementById('stage'),size=9,images={},ports=[{bit:1,dx:0,dy:-1},{bit:2,dx:1,dy:0},{bit:4,dx:0,dy:1},{bit:8,dx:-1,dy:0}];let cells=new Set(data.plan.cells),erase=false,drag=false,last=null,ready=false;
function mask(x,y){return ports.reduce((m,p)=>m|(cells.has(`${x+p.dx},${y+p.dy}`)?p.bit:0),0)}
function variantFor(x,y,mask){const h=(Math.imul(x+41,73856093)^Math.imul(y+67,19349663)^Math.imul(mask,83492791))>>>0;return{light:h%5===0,leaves:h%4!==0}}
function render(){
 const z=Number(document.getElementById('zoom').value)/100,W=1024*z,H=512*z,dpr=window.devicePixelRatio||1,cw=Math.ceil((size+1)*W),ch=Math.ceil((size+1)*H);
 if(!ready)return;stage.style.width=cw+'px';stage.style.height=ch+'px';const vw=view.clientWidth,vh=view.clientHeight;
 canvas.style.width=vw+'px';canvas.style.height=vh+'px';canvas.style.left=view.scrollLeft+'px';canvas.style.top=view.scrollTop+'px';canvas.width=Math.round(vw*dpr);canvas.height=Math.round(vh*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.fillStyle='#334535';ctx.fillRect(0,0,vw,vh);
 const sorted=[...cells].map(k=>{const[x,y]=k.split(',').map(Number);return{x,y,m:mask(x,y)}}).sort((a,b)=>a.x+a.y-b.x-b.y||a.x-b.x);
 // Integral backing-pixel corners avoid fractional drawImage cracks at review zoom.
 for(const t of sorted){const a=data.atlas.assets[t.m],v=variantFor(t.x,t.y,t.m),left=Math.round((size*W/2+(t.x-t.y)*W/2-W/2-view.scrollLeft)*dpr)/dpr,top=Math.round(((t.x+t.y)*H/2-view.scrollTop)*dpr)/dpr;
  if(left+W<0||top+H<0||left>vw||top>vh)continue;
  ctx.drawImage(images[a.file],left,top,W,H);if(document.getElementById('lines').checked)ctx.drawImage(images[a.lines],left,top,W,H);if(document.getElementById('lights').checked&&v.light)ctx.drawImage(images[a.light],left,top,W,H);if(document.getElementById('leaves').checked&&v.leaves){ctx.drawImage(images[a.sidewalkLeaves],left,top,W,H);ctx.drawImage(images[a.gutterLeaves],left,top,W,H)}
 }
 document.getElementById('zoom-value').textContent=Math.round(z*100)+'%';status.textContent=`${cells.size} sections · 2:1 projection · 2× antialias bake · individual leaf sprites · current-pixel lighting · art prototype only`;
}
function edit(e){const z=Number(document.getElementById('zoom').value)/100,W=1024*z,H=512*z,r=view.getBoundingClientRect(),sx=e.clientX-r.left+view.scrollLeft-size*W/2,sy=e.clientY-r.top+view.scrollTop,x=Math.floor((sx/(W/2)+sy/(H/2))/2),y=Math.floor((sy/(H/2)-sx/(W/2))/2);if(x<0||y<0||x>=size||y>=size)return;const k=`${x},${y}`;if(k===last)return;last=k;if(erase)cells.delete(k);else cells.add(k);render()}
canvas.addEventListener('pointerdown',e=>{drag=true;last=null;canvas.setPointerCapture(e.pointerId);edit(e)});canvas.addEventListener('pointermove',e=>{if(drag)edit(e)});canvas.addEventListener('pointerup',()=>{drag=false;last=null});canvas.addEventListener('pointercancel',()=>{drag=false;last=null});
document.getElementById('draw').onclick=()=>{erase=false;document.getElementById('draw').classList.add('active');document.getElementById('erase').classList.remove('active')};document.getElementById('erase').onclick=()=>{erase=true;document.getElementById('erase').classList.add('active');document.getElementById('draw').classList.remove('active')};document.getElementById('reset').onclick=()=>{cells=new Set(data.plan.cells);render()};document.getElementById('clear').onclick=()=>{cells.clear();render()};for(const id of ['lines','lights','leaves'])document.getElementById(id).oninput=render;
let lastZoom=.25;document.getElementById('zoom').oninput=()=>{const next=Number(document.getElementById('zoom').value)/100,cx=(view.scrollLeft+view.clientWidth/2)/lastZoom,cy=(view.scrollTop+view.clientHeight/2)/lastZoom;render();view.scrollLeft=cx*next-view.clientWidth/2;view.scrollTop=cy*next-view.clientHeight/2;lastZoom=next;render()};view.addEventListener('scroll',render);window.addEventListener('resize',render);
document.getElementById('save').onclick=()=>{const b=new Blob([JSON.stringify({version:2,cellM:16,projection:'2:1',cells:[...cells]},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='maple-falls-road-plan-v2.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
Promise.all(Object.entries(data.images).map(([key,src])=>new Promise((resolve,reject)=>{const img=new Image;img.onload=()=>{images[key]=img;resolve()};img.onerror=reject;img.src=src}))).then(()=>{ready=true;render();view.scrollLeft=1280-view.clientWidth/2;view.scrollTop=448-view.clientHeight/2;render()}).catch(()=>status.textContent='An embedded road PNG could not be loaded.');
</script></html>
