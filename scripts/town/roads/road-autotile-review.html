<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Maple Falls — painted road builder</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d171c;color:#fff;font:15px system-ui}header{padding:16px 22px;border-bottom:1px solid #47605d;display:flex;gap:18px;flex-wrap:wrap;align-items:center}h1{font-size:20px;margin:0}p{margin:4px 0;color:#d4e1db}button,select,input{font:inherit}button{padding:9px 15px;border:1px solid #be8648;background:#19312a;color:#fff;cursor:pointer}button.active{background:#d96c13}label{display:inline-flex;gap:6px;align-items:center}#view{height:calc(100vh - 140px);min-height:420px;overflow:auto;background:#263a2c;touch-action:none}canvas{display:block}footer{padding:10px 22px;color:#e0e8e3;font-size:13px}a{color:#ffd086}</style>
<header><div><h1>Maple Falls · painted road builder</h1><p>Click or drag to build. Neighbouring pieces change automatically.</p></div><button id="draw" class="active">Build road</button><button id="erase">Erase</button><button id="reset">Reset proof</button><button id="clear">Clear</button><button id="save">Save layout JSON</button><label><input id="lines" type="checkbox" checked>Painted lines</label><label><input id="lights" type="checkbox" checked>One-light variants</label><label>Zoom <input id="zoom" type="range" min="12" max="70" value="25"></label></header>
<div style="padding:8px 22px"><label><input id="leaves" type="checkbox" checked>Separate sidewalk and gutter leaf decals</label></div><div id="view"><canvas id="canvas"></canvas></div><footer id="status">Loading native painted PNG parts…</footer>
<script>const data=/*ASSETS*/;
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),size=9,images={},ports=[{bit:1,dx:0,dy:-1},{bit:2,dx:1,dy:0},{bit:4,dx:0,dy:1},{bit:8,dx:-1,dy:0}];let cells=new Set(data.plan.cells),erase=false,drag=false,last=null;
function mask(x,y){return ports.reduce((m,p)=>m|(cells.has(`${x+p.dx},${y+p.dy}`)?p.bit:0),0)}
function render(){const z=Number(document.getElementById('zoom').value)/100,W=1024*z,H=512*z;canvas.width=Math.ceil((size+1)*W);canvas.height=Math.ceil((size+1)*H);ctx.fillStyle='#334535';ctx.fillRect(0,0,canvas.width,canvas.height);const sorted=[...cells].map(k=>{const[x,y]=k.split(',').map(Number);return{x,y,m:mask(x,y)}}).sort((a,b)=>a.x+a.y-b.x-b.y);for(const[i,t]of sorted.entries()){const a=data.atlas.assets[t.m],left=size*W/2+(t.x-t.y)*W/2-W/2,top=(t.x+t.y)*H/2;ctx.drawImage(images[a.file],left,top,W,H);if(document.getElementById('lines').checked)ctx.drawImage(images[a.lines],left,top,W,H);if(document.getElementById('lights').checked&&i%6===0)ctx.drawImage(images[a.light],left,top,W,H);if(document.getElementById('leaves').checked&&i%3!==1){ctx.drawImage(images[a.sidewalkLeaves],left,top,W,H);ctx.drawImage(images[a.gutterLeaves],left,top,W,H)}}status.textContent=`${cells.size} sections · fixed2:1 projection · asphalt6.5m / sidewalk1.8m · painted reference pixels · art prototype, not live terrain`}
function edit(e){const z=Number(document.getElementById('zoom').value)/100,W=1024*z,H=512*z,r=canvas.getBoundingClientRect(),sx=(e.clientX-r.left)*canvas.width/r.width-size*W/2,sy=(e.clientY-r.top)*canvas.height/r.height,x=Math.floor((sx/(W/2)+sy/(H/2))/2),y=Math.floor((sy/(H/2)-sx/(W/2))/2);if(x<0||y<0||x>=size||y>=size)return;const k=`${x},${y}`;if(k===last)return;last=k;if(erase)cells.delete(k);else cells.add(k);render()}
canvas.addEventListener('pointerdown',e=>{drag=true;last=null;canvas.setPointerCapture(e.pointerId);edit(e)});canvas.addEventListener('pointermove',e=>{if(drag)edit(e)});canvas.addEventListener('pointerup',()=>{drag=false;last=null});canvas.addEventListener('pointercancel',()=>{drag=false;last=null});
document.getElementById('draw').onclick=()=>{erase=false;document.getElementById('draw').classList.add('active');document.getElementById('erase').classList.remove('active')};document.getElementById('erase').onclick=()=>{erase=true;document.getElementById('erase').classList.add('active');document.getElementById('draw').classList.remove('active')};document.getElementById('reset').onclick=()=>{cells=new Set(data.plan.cells);render()};document.getElementById('clear').onclick=()=>{cells.clear();render()};for(const id of ['lines','lights','leaves','zoom'])document.getElementById(id).oninput=render;document.getElementById('save').onclick=()=>{const b=new Blob([JSON.stringify({version:1,cellM:16,projection:'2:1',cells:[...cells]},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='maple-falls-road-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
Promise.all(Object.entries(data.images).map(([key,src])=>new Promise((resolve,reject)=>{const img=new Image;img.onload=()=>{images[key]=img;resolve()};img.onerror=reject;img.src=src}))).then(render).catch(()=>status.textContent='An embedded road PNG could not be loaded.');
</script></html>
